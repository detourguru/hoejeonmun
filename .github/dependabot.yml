version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint # eslint-plugin-import가 아직 eslint 10을 지원하지 않음
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript # typescript-eslint가 아직 TypeScript 7을 지원하지 않음
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
